<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Cocoon Experiences</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=IBM+Plex+Mono:wght@400&display=swap" onload="this.onload=null;this.rel='stylesheet'">

<link rel="stylesheet" href="/styles/global.css">
<style>
  body { min-height: 100dvh; min-height: 100svh; display: flex; align-items: center; justify-content: center; }
  .not-found { text-align: center; padding: 1.5rem; }
  .not-found .code { font-family: var(--font-mono); font-size: var(--text-caption); letter-spacing: var(--tracking-caption); color: var(--color-text-sub); text-transform: uppercase; margin-bottom: 1rem; }
  .not-found h1 { font-size: var(--text-h2); margin-bottom: 1.5rem; }
  .not-found a { font-family: var(--font-mono); font-size: var(--text-caption); letter-spacing: var(--tracking-caption); text-transform: uppercase; color: var(--color-text-sub); transition: color var(--beat-half) var(--ease-drift); }
  .not-found a:hover, .not-found a:focus-visible { color: var(--ce-amber); }
</style>
</head>
<body>
<div class="not-found">
  <div class="code">404</div>
